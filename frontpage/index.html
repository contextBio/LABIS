<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABIS — Lab Intelligence System</title>
<!-- LABIS 정적 프론트(SPA) — contextbio.ai/labis 에 실려 주소를 유지한 채 동작한다.
     백엔드 주소의 정본은 cb-backend 메타(빌드가 채움), 인증은 통합계정 ID 토큰
     Bearer(BioWrit 모델, 쿠키 없음). 조회는 /api/v1/list·project·summary,
     등록·수정·삭제는 /api/v1/write (로그인 + 랩 소속 + op 별 역할 검증).
     구글시트 연동은 이 화면 안에서 전부 한다(/api/v1/sheet) — 항목별 주소는 각 메뉴
     안에서, 전체 실행·양식은 "구글시트 연동" 메뉴에서. 아직 옮기지 않은 학과관리만
     설정 화면의 링크로 "기존 화면"(c1 SSR, 토큰 릴레이 무로그인)을 연다. -->
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --brand:#0369a1; --brand-strong:#075985; --accent:#b45309; --card:#fff;
    --ok:#047857; --bad:#b91c1c;
  }
  html[data-theme="dark"]{
    --ink:#e2e8f0; --muted:#8ea0b8; --line:#26344a; --bg:#0b1220;
    --brand:#4ba3d8; --brand-strong:#7cc0e8; --accent:#e0a35a; --card:#111b2d;
    --ok:#34d399; --bad:#f87171;
  }
  html[data-theme="dark"] .badge.op{background:#12263f;border-color:#1e3a5f;color:#7cc0e8}
  html[data-theme="dark"] nav.side a.on{background:#12263f}
  html[data-theme="dark"] #err{background:#2a1215}
  html[data-theme="dark"] .flash{background:#0d2b22}
  html[data-theme="dark"] .btn.solid{color:#08121f}
  html[data-theme="dark"] button.primary{color:#08121f}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans KR",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:36px 32px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .brand{text-align:center;margin-bottom:6px;font-size:30px;font-weight:900;
         letter-spacing:-.02em;color:var(--brand)}
  .tagline{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:26px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
  select,input,textarea{padding:9px 12px;border:1px solid var(--line);
        border-radius:9px;background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit}
  select:disabled{color:var(--muted);background:var(--bg)}
  #entry select{width:100%}
  button.primary{width:100%;margin-top:14px;padding:11px 12px;border:0;border-radius:9px;
                 background:var(--brand);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  button.primary:hover{background:var(--brand-strong)}
  .hint{margin-top:16px;text-align:center;font-size:11.5px;line-height:1.7;color:var(--muted)}
  .feats{margin:0 0 22px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .feats li{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;
            padding:3px 10px;background:var(--bg)}

  /* ── 앱 셸 ── */
  #app{display:none}
  .apphead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
           padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .apphead .brand-sm{font-size:19px;font-weight:900;color:var(--brand);letter-spacing:-.02em}
  .apphead select{font-size:13px;padding:7px 10px}
  .apphead .who{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .btn{white-space:nowrap;padding:7px 13px;border:1px solid var(--line);border-radius:9px;
       background:var(--card);color:var(--ink);font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.solid:hover{background:var(--brand-strong)}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .shell{display:flex;min-height:calc(100vh - 57px)}
  nav.side{width:186px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--card);padding:12px 0}
  nav.side a{display:block;padding:8px 18px;color:var(--ink);font-size:13.5px}
  nav.side a:hover{background:var(--bg);text-decoration:none}
  nav.side a.on{color:var(--brand);font-weight:700;background:#eff6ff}
  nav.side .sep{margin:10px 18px;border-top:1px solid var(--line)}
  nav.side .cap{padding:4px 18px;font-size:10.5px;color:#94a3b8;letter-spacing:.08em}
  main#view{flex:1;min-width:0;padding:20px 22px 60px;max-width:1140px}
  h1.pg{font-size:18px;margin:2px 0 4px}
  p.desc{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  h2{font-size:14.5px;margin:24px 0 8px}
  h2 .btn{margin-left:8px;vertical-align:middle}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:13px 15px;color:inherit}
  .stat:hover{border-color:var(--brand);text-decoration:none}
  .stat .k{font-size:11.5px;color:var(--muted)}
  .stat .v{font-size:21px;font-weight:800;margin-top:2px}
  .stat.accent .v{color:var(--accent)}
  .tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;color:var(--muted);background:var(--bg);font-weight:600;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:nowrap}
  td.dim{color:var(--muted);font-size:12px;white-space:nowrap}
  td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td.act{white-space:nowrap}
  td.act select{padding:4px 6px;font-size:11.5px}
  .empty-row{color:#94a3b8;text-align:center;padding:18px 0}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
         background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.op{background:#eff6ff;border-color:#bfdbfe;color:var(--brand)}
  .pos{color:var(--ok)} .neg{color:var(--bad)}
  .grid2{display:grid;gap:18px}
  @media(min-width:1000px){.grid2{grid-template-columns:1fr 1fr}}
  .note{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.7}
  #err{display:none;margin:10px 0;padding:10px 14px;border-radius:9px;background:#fef2f2;color:var(--bad);font-size:13px}
  .kv{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;font-size:13px;
      background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:640px}
  .kv .k{color:var(--muted);font-size:12px}
  form.assign{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
  form.assign input{width:240px}
  .flash{margin:8px 0;padding:8px 12px;border-radius:8px;background:#ecfdf5;color:var(--ok);font-size:12.5px}

  /* ── 항목별 구글시트 연동 ── */
  details.sheets{background:var(--card);border:1px solid var(--line);border-radius:12px;
                 padding:10px 14px;margin:0 0 14px}
  details.sheets>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}
  details.sheets .cnt{margin-left:6px;font-weight:400;font-size:11.5px;color:var(--muted)}
  details.sheets .cnt.bad{color:var(--bad)}
  details.sheets .sbody{margin-top:8px}
  .srow{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto auto;
        gap:5px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .srow:first-child{border-top:0;padding-top:2px}
  .srow>label{font-size:12.5px;font-weight:600;color:var(--muted)}
  .srow>input{width:100%;font-size:12.5px;padding:6px 10px}
  .srow .open{font-size:11.5px;white-space:nowrap;min-width:0}
  .srow .slog{grid-column:2/-1;font-size:11.5px;color:var(--muted);line-height:1.5}
  .srow .slog.ok{color:var(--ok)}
  .srow .slog.warn{color:var(--accent)}
  .srow .slog.bad{color:var(--bad)}
  .note.bad{color:var(--bad)}
  ul.guide{margin:6px 0 0;padding-left:18px;font-size:11.5px;color:var(--muted);line-height:1.8}
  ul.guide b{color:var(--ink)}
  @media(max-width:760px){
    .srow{grid-template-columns:minmax(0,1fr) auto auto}
    .srow>label,.srow>input,.srow .slog{grid-column:1/-1}
  }

  /* ── 모달 폼 ── */
  #modalWrap{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;
             justify-content:center;background:rgba(15,23,42,.45);overflow:auto;padding:40px 16px}
  #modal{background:var(--card);border-radius:14px;max-width:480px;width:100%;padding:24px 26px;
         box-shadow:0 10px 40px rgba(15,23,42,.25)}
  #modal h3{margin:0 0 16px;font-size:15.5px}
  #modal .fld{margin-bottom:12px}
  #modal .fld input,#modal .fld select,#modal .fld textarea{width:100%}
  #modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
</style>
</head>
<body>

<!-- ── 뷰 1: 입장 ── -->
<div class="center" id="entry">
  <main class="card">
    <div class="brand">LABIS</div>
    <p class="tagline">Lab Intelligence System — 연구실·학과 운영 관리</p>
    <ul class="feats">
      <li>인사</li><li>과제</li><li>연구비</li><li>성과</li><li>구매</li><li>장비</li><li>LIMS</li>
    </ul>
    <p class="hint" id="entryWait" style="font-size:13px">입장 중…</p>
    <div id="entryPick" style="display:none">
      <form id="enterForm">
        <label for="labSelect">연구실 선택</label>
        <select id="labSelect" disabled>
          <option value="">연구실 목록을 불러오는 중…</option>
        </select>
        <button type="submit" class="primary">LABIS 입장</button>
      </form>
      <p class="hint">
        contextBio 통합 계정으로 로그인합니다.<br>
        접근 권한은 관리자의 초대로 부여됩니다.
      </p>
    </div>
  </main>
</div>

<!-- ── 뷰 2: 앱 ── -->
<div id="app">
  <!-- 공통 상단 줄(앱 메뉴·문서·계정·언어·테마)은 통합 사이트 빌드가 이 줄 끝에
       인라인으로 세운다 — 계정 표시는 그쪽이 맡는다. -->
  <header class="apphead">
    <span class="brand-sm">LABIS</span>
    <select id="dashLab" title="연구실 전환"></select>
  </header>
  <div class="shell">
    <nav class="side" id="sideNav"></nav>
    <main id="view"></main>
  </div>
</div>

<!-- ── 모달 폼 ── -->
<div id="modalWrap"><div id="modal"></div></div>

<script>
(function () {
  "use strict";
  var meta = document.querySelector('meta[name="cb-backend"]');
  var BACKEND = ((meta && meta.getAttribute("content")) || "https://c1.sysmed.kr/labis")
    .trim().replace(/\/+$/, "");
  var LAB_KEY = "labis.activeLab";

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function won(n) { return (Number(n) || 0).toLocaleString("ko-KR") + "원"; }
  function pct(spent, total) { return total > 0 ? Math.round((spent / total) * 100) + "%" : "-"; }
  var ROLE_KO = { PI: "연구책임자", LAB_MANAGER: "랩매니저", MEMBER: "연구원", DEPT_ADMIN: "학과관리자" };
  var RANKS = { MEMBER: 1, LAB_MANAGER: 2, PI: 3, DEPT_ADMIN: 4 };
  function roleBadge(role) {
    var op = role === "PI" || role === "LAB_MANAGER" || role === "DEPT_ADMIN";
    return '<span class="badge' + (op ? " op" : "") + '">' +
      (op ? "운영자 · " : "팀원 · ") + esc(ROLE_KO[role] || role) + "</span>";
  }

  /* ── 상태값 (기존 화면과 동일) ── */
  var ST = {
    project: ["계획", "진행", "종료", "중단"],
    research: ["계획", "진행", "완료", "보류", "중단"],
    milestone: ["예정", "진행", "완료", "지연"],
    leave: ["신청", "승인", "반려"],
    purchase: ["신청", "발주", "입고", "취소"],
    sample: ["보관", "사용중", "소진", "폐기"],
    experiment: ["계획", "진행", "완료", "보류"],
    instrument: ["정상", "점검중", "고장", "폐기"],
    patent: ["출원", "등록", "거절", "포기"],
    work: ["재직", "휴직", "퇴직"],
  };

  /* ── 통합계정 토큰 ── */
  var WAIT_MS = 4000;
  function bridgeWait() {
    if (window.ContextAuth) return Promise.resolve(window.ContextAuth);
    return new Promise(function (resolve) {
      var t0 = Date.now();
      var t = setInterval(function () {
        if (window.ContextAuth || Date.now() - t0 > WAIT_MS) {
          clearInterval(t); resolve(window.ContextAuth || null);
        }
      }, 50);
    });
  }
  function idToken() {
    return bridgeWait().then(function (api) {
      if (!api || !api.ready) return "";
      var settled = api.whenReady ? api.whenReady() : Promise.resolve();
      var timeout = new Promise(function (r) { setTimeout(r, WAIT_MS); });
      return Promise.race([settled, timeout])
        .then(function () { return api.getIdToken(); })
        .catch(function () { return ""; });
    });
  }
  var TOKEN = "", ME = null, LAB = 0, CACHE = {};
  /** 현재 화면에서 쓰기가 허용되는가 — route() 가 메뉴 권한을 보고 정한다 */
  var VIEW_EDIT = true;

  /** 팀관리자가 조정한 이 랩에서의 메뉴 권한 (설정이 없으면 edit) */
  function mlevel(key) {
    if (!ME || !key) return "edit";
    var l = (ME.labs || []).find(function (x) { return x.labId === LAB; });
    return (l && l.levels && l.levels[key]) || "edit";
  }
  function rank() {
    if (!ME) return 0;
    var l = (ME.labs || []).find(function (x) { return x.labId === LAB; });
    return l ? (RANKS[l.role] || 0) : 0;
  }
  function req(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + TOKEN }, opts.headers || {});
    return fetch(BACKEND + path, opts).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok || !d.ok) throw Object.assign(new Error(d.error || r.status), { code: d.error });
        return d;
      });
    });
  }
  function list(kind) {
    var key = LAB + ":" + kind;
    if (CACHE[key]) return Promise.resolve(CACHE[key]);
    return req("/api/v1/list?lab=" + LAB + "&kind=" + kind).then(function (d) {
      CACHE[key] = d.rows; return d.rows;
    });
  }
  function invalidate(kinds) {
    (kinds || []).forEach(function (k) { delete CACHE[LAB + ":" + k]; });
  }
  /** 등록·수정·삭제 — 성공하면 관련 캐시를 비우고 현재 화면을 다시 그린다 */
  function write(op, data, kinds) {
    return req("/api/v1/write?lab=" + LAB, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: op, data: data || {} }),
    }).then(function (d) { invalidate(kinds); return d; });
  }
  function openLegacy(path) {
    location.href = BACKEND + "/login?next=" + encodeURIComponent(path) +
      (TOKEN ? "#token=" + encodeURIComponent(TOKEN) : "");
  }

  /* ── 선택지 소스 ── */
  function userOpts(label) {
    return list("members").then(function (rs) {
      return [{ v: "", t: label || "— 선택 안 함 —" }].concat(rs.map(function (r) {
        return { v: r.userId, t: r.name + (r.position ? " (" + r.position + ")" : "") };
      }));
    });
  }
  function projectOpts() {
    return list("projects").then(function (rs) {
      return [{ v: "", t: "— 과제 미지정 —" }].concat(rs.map(function (r) {
        return { v: String(r.id), t: r.code + " · " + r.title.slice(0, 24) };
      }));
    });
  }
  function sampleOpts() {
    return list("samples").then(function (rs) {
      return [{ v: "", t: "— 시료 미지정 —" }].concat(rs.map(function (r) {
        return { v: String(r.id), t: r.code + " · " + r.name };
      }));
    });
  }

  /* ── 모달 폼 ──
     fields: [{k,label,type:text|number|date|textarea|select,opts,req,def,half}] */
  function openForm(title, fields, onSubmit) {
    var withOpts = fields.map(function (f) {
      if (typeof f.opts === "function") {
        return f.opts().then(function (o) { return Object.assign({}, f, { opts: o }); });
      }
      return Promise.resolve(f);
    });
    Promise.all(withOpts).then(function (fs) {
      var m = $("modal");
      m.innerHTML = "<h3>" + esc(title) + "</h3><form id=modalForm>" +
        fs.map(function (f, i) {
          var inner;
          if (f.type === "select") {
            inner = '<select data-i="' + i + '">' + (f.opts || []).map(function (o) {
              var v = o.v !== undefined ? o.v : o, t = o.t !== undefined ? o.t : o;
              return '<option value="' + esc(v) + '"' + (String(f.def) === String(v) ? " selected" : "") + ">" + esc(t) + "</option>";
            }).join("") + "</select>";
          } else if (f.type === "textarea") {
            inner = '<textarea data-i="' + i + '" rows="2">' + esc(f.def || "") + "</textarea>";
          } else {
            inner = '<input data-i="' + i + '" type="' + (f.type || "text") + '" value="' + esc(f.def || "") + '"' +
              (f.req ? " required" : "") + ">";
          }
          return '<div class="fld"><label>' + esc(f.label) + (f.req ? " *" : "") + "</label>" + inner + "</div>";
        }).join("") +
        '<div class="btns"><button type="button" class="btn" id="mCancel">취소</button>' +
        '<button type="submit" class="btn solid">저장</button></div></form>';
      $("modalWrap").style.display = "flex";
      $("mCancel").onclick = closeForm;
      $("modalForm").onsubmit = function (e) {
        e.preventDefault();
        var data = {};
        fs.forEach(function (f, i) {
          var el = m.querySelector('[data-i="' + i + '"]');
          data[f.k] = el ? el.value : "";
        });
        var btn = m.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "저장 중…";
        onSubmit(data).then(function () { closeForm(); route(); })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = "저장";
            alert("실패: " + (err.code || err.message));
          });
      };
    });
  }
  function closeForm() { $("modalWrap").style.display = "none"; $("modal").innerHTML = ""; }
  $("modalWrap").addEventListener("click", function (e) { if (e.target === this) closeForm(); });

  /* ── 행 단위 조작 셀 ── */
  function statusSel(op, id, cur, opts, kinds) {
    if (!VIEW_EDIT) return '<span class="badge">' + esc(cur || "-") + "</span>";
    return '<select data-sop="' + op + '" data-id="' + id + '" data-kinds="' + kinds.join(",") + '">' +
      opts.map(function (o) { return '<option' + (o === cur ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") +
      "</select>";
  }
  function delBtn(op, id, kinds) {
    if (!VIEW_EDIT) return "";
    return '<button class="btn sm danger" data-del="' + op + '" data-id="' + id +
      '" data-kinds="' + kinds.join(",") + '">삭제</button>';
  }

  /* ── 범용 표 ── */
  function table(cols, rows, emptyMsg) {
    var h = '<div class="tblwrap"><table><thead><tr>' +
      cols.map(function (c) { return "<th>" + esc(c.h) + "</th>"; }).join("") +
      "</tr></thead><tbody>";
    if (!rows || !rows.length) {
      h += '<tr><td colspan="' + cols.length + '" class="empty-row">' + esc(emptyMsg || "데이터가 없습니다") + "</td></tr>";
    } else {
      h += rows.map(function (r) {
        return "<tr>" + cols.map(function (c) {
          var v = c.f ? c.f(r) : esc(r[c.k] == null || r[c.k] === "" ? "-" : r[c.k]);
          return "<td" + (c.cls ? ' class="' + c.cls + '"' : "") + ">" + v + "</td>";
        }).join("") + "</tr>";
      }).join("");
    }
    return h + "</tbody></table></div>";
  }
  var B = function (r, k) { return '<span class="badge">' + esc(r[k] || "-") + "</span>"; };

  /* ── 항목별 구글시트 연동 ──
     주소를 저장하면 그 자리에서 시트를 읽어 해당 항목 DB에 반영한다(POST /api/v1/sheet).
     워크시트는 URL 의 #gid= > 항목 이름과 같은 탭 > 시트가 하나뿐이면 그 시트 순으로 고른다. */
  var SHEETS_OPEN = false;

  function logTone(log) {
    if (!log) return "";
    var t = log.lines.join(" ");
    if (t.indexOf("❌") >= 0) return " bad";
    if (t.indexOf("⚠") >= 0) return " warn";
    return " ok";
  }
  function sheetShell(inner, open) {
    return '<details class="sheets"' + (open ? " open" : "") + ">" + inner + "</details>";
  }
  function sheetSummary(note, bad) {
    return "<summary>📊 구글시트 연동" +
      '<span class="cnt' + (bad ? " bad" : "") + '">' + esc(note) + "</span></summary>";
  }
  function sheetRowHtml(r) {
    var href = "https://docs.google.com/spreadsheets/d/" + esc(r.id) + (r.gid ? "/edit#gid=" + esc(r.gid) : "");
    return '<div class="srow" data-tab="' + esc(r.tab) + '">' +
      "<label>" + esc(r.tab) + "</label>" +
      '<input type="url" value="' + esc(r.url || "") +
        '" placeholder="구글시트 주소 붙여넣기 — …/spreadsheets/d/…#gid=0">' +
      '<button class="btn solid sm" data-act="save">저장 · 가져오기</button>' +
      '<button class="btn sm" data-act="import"' + (r.id ? "" : " disabled") + ">↻ 다시</button>" +
      '<span class="open">' + (r.id ? '<a href="' + href + '" target="_blank" rel="noreferrer">시트 열기 ↗</a>' : "") + "</span>" +
      '<div class="slog' + logTone(r.log) + '">' +
        (r.log ? esc(r.log.at) + " · " + esc(r.log.lines.join(" / ")) : "") + "</div></div>";
  }
  /** plain = 전용 화면(구글시트 연동 메뉴) — 접이식 껍데기 없이 목록만 편다 */
  function renderSheets(rows, plain) {
    var box = $("sheetBox"); if (!box) return;
    var body = '<div class="sbody">' + rows.map(sheetRowHtml).join("") + "</div>";
    if (plain) { box.innerHTML = body; return; }
    var linked = rows.filter(function (r) { return !!r.id; }).length;
    box.innerHTML = sheetShell(
      sheetSummary(linked ? linked + "/" + rows.length + "개 항목 연결됨"
                          : "시트 주소를 넣으면 그 자리에서 가져옵니다") + body, SHEETS_OPEN);
  }
  function mountSheets(tabs) {
    var box = $("sheetBox"); if (!box) return;
    box.innerHTML = sheetShell(sheetSummary("불러오는 중…"), SHEETS_OPEN);
    req("/api/v1/sheet?lab=" + LAB + "&tabs=" + encodeURIComponent(tabs.join(",")))
      .then(function (d) { renderSheets(d.rows); })
      .catch(function (e) {
        var b = $("sheetBox");
        if (b) b.innerHTML = sheetShell(sheetSummary("불러오지 못했습니다 (" + (e.code || e.message) + ")", true), SHEETS_OPEN);
      });
  }

  function head(title, desc, toolbar, sheetTabs) {
    var h = '<h1 class="pg">' + esc(title) + '</h1><p class="desc">' + esc(desc || "") + "</p>" +
      '<div id="err"></div>';
    // 운영자(랩매니저) 이상에게만 — innerHTML 이 박힌 뒤에 채운다
    if (sheetTabs && sheetTabs.length && rank() >= 2 && VIEW_EDIT) {
      h += '<div id="sheetBox"></div>';
      setTimeout(function () { mountSheets(sheetTabs); }, 0);
    }
    return h + (toolbar ? '<div class="toolbar">' + toolbar + "</div>" : "");
  }
  function showErr(e) {
    var el = $("err"); if (!el) return;
    el.textContent = "불러오지 못했습니다 (" + (e.code || e.message) + ")";
    el.style.display = "block";
  }

    if (!VIEW_EDIT) return "";

      (flash ? '<div class="flash">' + esc(flash) + "</div>" : "") +
      "<h2>구성원</h2>" +
      '<p class="note" style="margin-top:0">팀 운영자(연구책임자·랩매니저)와 팀원을 배정합니다. ' +
      "이 연구실에 배정되지 않은 계정은 접근할 수 없습니다.</p>" +
      '<div id="assignBox"></div><h3>배정된 구성원</h3><div id="t1"></div>' +
      '<div id="inviteSec" style="display:none"><h3>대기 중인 초대</h3><div id="t2"></div></div>' +
      (rank() >= 3 ? '<h2>메뉴 권한 (팀관리자)</h2>' +
        '<p class="note" style="margin-top:0">구성원별로 메뉴 접근을 조정합니다 — 편집 / 읽기 전용 / 차단. ' +
        "권한은 <b>좁히기만</b> 합니다: 편집으로 둬도 역할이 모자라면 여전히 막힙니다.</p>" +
        '<div id="permBox">불러오는 중…</div>' : "") +
      "<h2>학과 관리</h2>" +
      '<p class="note" style="margin-top:0">연구실 개설·폐쇄와 학과관리자 지정은 아직 기존 화면에서 합니다.</p>' +
      '<div class="toolbar"><button class="btn" data-legacy="/admin/labs">학과 관리 열기 ↗</button></div>';
    req("/api/v1/lab/members?lab=" + LAB).then(function (d) { renderTeam(d); }).catch(showErr);
    if (rank() >= 3) {
      req("/api/v1/perm?lab=" + LAB)
        .then(function (d) { renderPerm(d.menus, d.rows); })
        .catch(function (e) {
          var b = $("permBox");
          if (b) b.innerHTML = '<p class="note bad">불러오지 못했습니다 (' + esc(e.code || e.message) + ")</p>";
        });
    }
  };
  VIEWS.team = VIEWS.settings;   // 예전 해시(#/team)·재렌더 호출 호환

  var LEVELS = [["edit", "편집"], ["view", "읽기"], ["none", "차단"]];

  function renderPerm(menus, rows) {
    var box = $("permBox"); if (!box) return;
    box.innerHTML =
      '<div class="tblwrap"><table><thead><tr><th>구성원</th>' +
      menus.map(function (m) { return "<th>" + esc(m.label) + "</th>"; }).join("") +
      "<th></th></tr></thead><tbody>" +
      rows.map(function (r) {
        if (!r.adjustable) {
          return '<tr><td><b>' + esc(r.name) + "</b><br><span style=\"font-size:11.5px;color:var(--muted)\">" + esc(r.email) + "</span></td>" +
            '<td class="dim" colspan="' + (menus.length + 1) + '">연구책임자·학과관리자는 조정 대상이 아닙니다 (항상 전체 편집)</td></tr>';
        }
        return '<tr data-perm="' + esc(r.userId) + '"><td><b>' + esc(r.name) + "</b><br><span style=\"font-size:11.5px;color:var(--muted)\">" + esc(r.email) + "</span></td>" +
          menus.map(function (m) {
            return '<td><select data-menu="' + esc(m.key) + '">' + LEVELS.map(function (l) {
              return '<option value="' + l[0] + '"' + (r.levels[m.key] === l[0] ? " selected" : "") + ">" + l[1] + "</option>";
            }).join("") + "</select></td>";
          }).join("") +
          '<td class="act"><button class="btn sm solid" data-permsave="' + esc(r.userId) + '">저장</button></td></tr>';
      }).join("") + "</tbody></table></div>";
  }

  function renderTeam(d) {
    var canAssign = d.myRank >= 2, canManage = d.myRank >= 3;
    if (canAssign) {
      $("assignBox").innerHTML =
        '<form class="assign" id="assignForm">' +
        '<input type="email" id="asEmail" required placeholder="이메일 (contextBio 계정)">' +
        '<select id="asRole"><option value="MEMBER">팀원 (연구원)</option>' +
        '<option value="LAB_MANAGER">팀 운영자 (랩매니저)</option>' +
        (d.myRank >= 3 ? '<option value="PI">팀 운영자 (연구책임자)</option>' : "") +
        '</select><button type="submit" class="btn solid">배정</button>' +
        '<span style="font-size:11.5px;color:var(--muted)">기존 계정은 즉시 배정, 처음이면 초대 링크가 만들어집니다</span></form>';
      $("assignForm").addEventListener("submit", function (e) {
        e.preventDefault();
        teamPost({ action: "assign", email: $("asEmail").value, role: $("asRole").value })
          .then(function (d2) {
            var msg = d2.assigned === "member" ? "배정했습니다."
              : "초대를 만들었습니다 — 초대 링크를 아래 목록에서 복사해 전달하세요.";
            invalidate(["members"]);
            VIEWS.team($("view"), null, msg);
          }).catch(function (e2) { alert("실패: " + (e2.code || e2.message)); });
      });
    } else {
      $("assignBox").innerHTML = '<p class="note">배정 변경은 팀 운영자만 할 수 있습니다.</p>';
    }

    var cols = [
      { h: "이름", k: "name" }, { h: "이메일", k: "email", cls: "dim" },
      { h: "직급", k: "position", cls: "dim" },
      { h: "구분", f: function (r) { return roleBadge(r.role); } },
      { h: "상태", f: function (r) { return B(r, "workStatus"); } },
    ];
    if (canManage) cols.push({ h: "관리", cls: "act", f: function (r) {
      return '<button class="btn sm" data-act="role" data-id="' + r.membershipId + '" data-role="' + esc(r.role) + '">역할 변경</button> ' +
        '<button class="btn sm danger" data-act="rm" data-id="' + r.membershipId + '">제외</button>';
    } });
    $("t1").innerHTML = table(cols, d.members, "배정된 구성원이 없습니다");

    if (canManage) $("t1").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button[data-act]") : null;
      if (!b) return;
      var id = Number(b.getAttribute("data-id"));
      if (b.getAttribute("data-act") === "rm") {
        if (!confirm("이 구성원을 연구실에서 제외할까요? (계정은 유지됩니다)")) return;
        teamPost({ action: "remove", membershipId: id })
          .then(function () { invalidate(["members"]); VIEWS.team($("view"), null, "제외했습니다."); })
          .catch(function (e2) { alert("실패: " + (e2.code || e2.message)); });
      } else {
        openForm("역할 변경", [
          { k: "role", label: "구분", type: "select", def: b.getAttribute("data-role"), opts: [
            { v: "MEMBER", t: "팀원 (연구원)" },
            { v: "LAB_MANAGER", t: "팀 운영자 (랩매니저)" },
            { v: "PI", t: "팀 운영자 (연구책임자)" },
          ] },
        ], function (fd) {
          return teamPost({ action: "set_role", membershipId: id, role: fd.role })
            .then(function () { invalidate(["members"]); });
        });
      }
    });

    if (d.invites.length && canAssign) {
      $("inviteSec").style.display = "block";
      $("t2").innerHTML = table([
        { h: "이메일", k: "email" },
        { h: "구분", f: function (r) { return roleBadge(r.role); } },
        { h: "만료", k: "expiresAt", cls: "mono" },
        { h: "초대 링크", cls: "act", f: function (r) {
          return '<button class="btn sm" data-copy="' + esc(BACKEND + "/invite/" + r.token) + '">링크 복사</button> ' +
            '<button class="btn sm danger" data-cancel="' + r.id + '">취소</button>';
        } },
      ], d.invites);
      $("t2").addEventListener("click", function (e) {
        var c = e.target.closest ? e.target.closest("button[data-copy]") : null;
        if (c) {
          navigator.clipboard.writeText(c.getAttribute("data-copy")).then(function () {
            c.textContent = "복사됨"; setTimeout(function () { c.textContent = "링크 복사"; }, 1500);
          });
          return;
        }
        var x = e.target.closest ? e.target.closest("button[data-cancel]") : null;
        if (x) {
          teamPost({ action: "cancel_invite", id: Number(x.getAttribute("data-cancel")) })
            .then(function () { VIEWS.team($("view"), null, "초대를 취소했습니다."); })
            .catch(function (e2) { alert("실패: " + (e2.code || e2.message)); });
        }
      });
    }
  }
  function teamPost(body) {
    return req("/api/v1/lab/members?lab=" + LAB, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  /* ── 행 조작 위임 (상태 select · 삭제 · 단일 op 버튼) ── */
  $("view").addEventListener("change", function (e) {
    var s2 = e.target.closest ? e.target.closest("select[data-sop]") : null;
    if (!s2) return;
    var kinds = (s2.getAttribute("data-kinds") || "").split(",").filter(Boolean);
    write(s2.getAttribute("data-sop"), { id: Number(s2.getAttribute("data-id")), status: s2.value }, kinds)
      .then(route)
      .catch(function (err) { alert("실패: " + (err.code || err.message)); route(); });
  });
  // 접힘 상태는 화면을 다시 그려도 유지한다 (toggle 은 버블링하지 않아 캡처로 받는다)
  $("view").addEventListener("toggle", function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains("sheets")) SHEETS_OPEN = t.open;
  }, true);
  $("view").addEventListener("click", function (e) {
    var lg = e.target.closest ? e.target.closest("[data-legacy]") : null;
    if (lg) { e.preventDefault(); openLegacy(lg.getAttribute("data-legacy")); return; }
    var ps = e.target.closest ? e.target.closest("button[data-permsave]") : null;
    if (ps) {
      e.preventDefault();
      var tr = ps.closest("tr");
      var levels = {};
      Array.prototype.slice.call(tr.querySelectorAll("select[data-menu]")).forEach(function (sel2) {
        levels[sel2.getAttribute("data-menu")] = sel2.value;
      });
      ps.disabled = true; ps.textContent = "저장 중…";
      req("/api/v1/perm?lab=" + LAB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: ps.getAttribute("data-permsave"), levels: levels }),
      }).then(function () {
        // 내 권한이 바뀌었을 수 있으니 me 를 다시 받아 사이드바까지 새로 그린다
        return req("/api/v1/me").then(function (d2) { ME = d2; CACHE = {}; route(); });
      }).catch(function (err) {
        ps.disabled = false; ps.textContent = "저장";
        alert("실패: " + (err.code || err.message));
      });
      return;
    }
    var ab = e.target.closest ? e.target.closest("button[data-all]") : null;
    if (ab) {
      e.preventDefault();
      var abs = Array.prototype.slice.call(ab.parentNode.querySelectorAll("button"));
      abs.forEach(function (b) { b.disabled = true; });
      $("allLog").innerHTML = '<p class="note">실행 중… (항목이 많으면 시간이 걸립니다)</p>';
      req("/api/v1/sheet?lab=" + LAB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ op: ab.getAttribute("data-all") }),
      }).then(function () { CACHE = {}; route(); })
        .catch(function (err) {
          abs.forEach(function (b) { b.disabled = false; });
          $("allLog").innerHTML = '<p class="note bad">실패: ' + esc(err.code || err.message) + "</p>";
        });
      return;
    }
    var sb = e.target.closest ? e.target.closest(".srow button[data-act]") : null;
    if (sb) {
      e.preventDefault();
      var row = sb.closest(".srow");
      var slog = row.querySelector(".slog");
      var btns = Array.prototype.slice.call(row.querySelectorAll("button"));
      btns.forEach(function (b) { b.disabled = true; });
      slog.className = "slog";
      slog.textContent = "시트를 읽어 반영하는 중…";
      req("/api/v1/sheet?lab=" + LAB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          op: sb.getAttribute("data-act"),
          tab: row.getAttribute("data-tab"),
          url: row.querySelector("input").value,
        }),
      }).then(function () {
        CACHE = {};          // 시트가 DB 를 바꿨다 — 목록 캐시를 전부 버린다
        SHEETS_OPEN = true;
        route();
      }).catch(function (err) {
        btns.forEach(function (b) { b.disabled = false; });
        slog.className = "slog bad";
        slog.textContent = "실패: " + (err.code || err.message);
      });
      return;
    }
    var del = e.target.closest ? e.target.closest("button[data-del]") : null;
    if (del) {
      if (!confirm("정말 삭제할까요?")) return;
      var kinds = (del.getAttribute("data-kinds") || "").split(",").filter(Boolean);
      write(del.getAttribute("data-del"), { id: Number(del.getAttribute("data-id")) }, kinds)
        .then(route)
        .catch(function (err) { alert("실패: " + (err.code || err.message)); });
      return;
    }
    var op = e.target.closest ? e.target.closest("button[data-op]") : null;
    if (op) {
      var kinds2 = (op.getAttribute("data-kinds") || "").split(",").filter(Boolean);
      write(op.getAttribute("data-op"), { id: Number(op.getAttribute("data-id")) }, kinds2)
        .then(route)
        .catch(function (err) { alert("실패: " + (err.code || err.message)); });
    }
  });

  /* ── 내비게이션·라우터 ── */
  // h=해시, t=이름, v=뷰, k=메뉴 키(팀관리자 권한 조정 대상), sep=앞에 구분선
  var NAV = [
    { h: "#/", t: "대시보드", v: "dash", k: "dashboard" },
    { h: "#/projects", t: "과제", v: "projects", k: "projects" },
    { h: "#/research", t: "프로젝트", v: "research", k: "research" },
    { h: "#/hr", t: "인사", v: "hr", k: "hr" },
    { h: "#/finance", t: "연구비", v: "finance", k: "finance" },
    { h: "#/outcomes", t: "성과", v: "outcomes", k: "outcomes" },
    { h: "#/purchases", t: "구매", v: "purchases", k: "purchases" },
    { h: "#/lims/instruments", t: "장비", v: "instruments", k: "instruments" },
    { h: "#/lims/samples", t: "시료 (LIMS)", v: "samples", k: "samples" },
    { h: "#/lims/experiments", t: "실험 (LIMS)", v: "experiments", k: "experiments" },
    { h: "#/sheets", t: "구글시트 연동", v: "sheets", k: "sheets", sep: true },
    { h: "#/settings", t: "설정", v: "settings" },
  ];
  function labName() {
    var l = (ME.labs || []).find(function (x) { return x.labId === LAB; });
    return l ? l.labName : "";
  }
  function renderNav() {
    var cur = location.hash || "#/";
    $("sideNav").innerHTML =
      NAV.filter(function (n2) { return mlevel(n2.k) !== "none"; })   // 팀관리자가 잠근 메뉴는 감춘다
        .map(function (n2) {
          var on = cur === n2.h || (n2.h !== "#/" && cur.indexOf(n2.h) === 0);
          return (n2.sep ? '<div class="sep"></div>' : "") +
            '<a href="' + n2.h + '"' + (on ? ' class="on"' : "") + ">" + esc(n2.t) + "</a>";
        }).join("");
  }
  function route() {
    if (!ME) return;
    renderNav();
    var h = location.hash || "#/";
    if (h === "#/team") { location.hash = "#/settings"; return; }   // 구성원 → 설정으로 옮김
    if (h === "#/sync") { location.hash = "#/sheets"; return; }
    var v = $("view");
    var m = /^#\/projects\/(\d+)$/.exec(h);
    var entry = NAV.find(function (n2) { return n2.h === (m ? "#/projects" : h); }) || NAV[0];
    // 잠긴 메뉴는 주소로 들어와도 홈으로 (서버 가드가 데이터도 막는다)
    if (mlevel(entry.k) === "none") { location.hash = "#/"; return; }
    VIEW_EDIT = mlevel(entry.k) === "edit";
    if (m) return VIEWS.projectDetail(v, Number(m[1]));
    (VIEWS[entry.v])(v);
  }
  window.addEventListener("hashchange", route);
  $("dashLab").addEventListener("change", function () {
    LAB = Number(this.value); CACHE = {};
    try { localStorage.setItem(LAB_KEY, String(LAB)); } catch (_) {}
    route();
  });

  /* ── 입장 흐름 ── */
  var sel = $("labSelect");
  fetch(BACKEND + "/api/labs")
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) {
      var labs = (d && d.labs) || [];
      sel.innerHTML = "";
      var any = document.createElement("option");
      any.value = ""; any.textContent = labs.length ? "— 연구실을 고르세요 —" : "(등록된 연구실 없음)";
      sel.appendChild(any);
      labs.forEach(function (l) {
        var o = document.createElement("option");
        o.value = String(l.id); o.textContent = l.name;
        if (o.value === String(localStorage.getItem(LAB_KEY))) o.selected = true;
        sel.appendChild(o);
      });
      sel.disabled = false;
    })
    .catch(function () {
      sel.innerHTML = '<option value="">목록을 불러오지 못했습니다 — 그대로 입장하세요</option>';
      sel.disabled = false;
    });

  var tokenPromise = idToken();

  /** auto = 사용자가 고르지 않은 자동 입장 — 갈 곳이 분명할 때만 통과시킨다 */
  function enterApp(token, wantLab, auto) {
    TOKEN = token;
    return req("/api/v1/me").then(function (d) {
      ME = d;
      var labs = d.labs || [];
      if (!labs.length) throw Object.assign(new Error("no_lab"), { code: "not_invited" });
      var matched = labs.some(function (l) { return String(l.labId) === String(wantLab); });
      // 저장된 랩이 유효하거나 소속 연구실이 하나뿐이면 선택 없이 들어간다
      if (auto && !matched && labs.length !== 1) {
        throw Object.assign(new Error("ambiguous"), { code: "ambiguous_lab" });
      }
      LAB = matched ? Number(wantLab) : labs[0].labId;
      try { localStorage.setItem(LAB_KEY, String(LAB)); } catch (_) {}
      var dl = $("dashLab");
      dl.innerHTML = "";
      labs.forEach(function (l) {
        var o = document.createElement("option");
        o.value = String(l.labId); o.textContent = l.labName;
        if (l.labId === LAB) o.selected = true;
        dl.appendChild(o);
      });
      $("entry").style.display = "none";
      $("app").style.display = "block";
      route();
    });
  }

  $("enterForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var lab = sel.value;
    var btn = document.querySelector("#enterForm button");
    btn.disabled = true; btn.textContent = "입장 중…";
    tokenPromise.then(function (token) {
      if (!token) {
        location.href = "/login?next=" + encodeURIComponent(location.pathname);
        return;
      }
      enterApp(token, lab).catch(function (err) {
        if (err && err.code === "not_invited") {
          btn.disabled = false; btn.textContent = "LABIS 입장";
          alert("이 계정은 아직 LABIS 에 초대되지 않았습니다. 관리자에게 초대를 요청하세요.");
          return;
        }
        openLegacy("/enter" + (lab ? "?lab=" + encodeURIComponent(lab) : ""));
      });
    });
  });

  function showPicker() {
    var w = $("entryWait"); if (w) w.style.display = "none";
    var p = $("entryPick"); if (p) p.style.display = "block";
  }

  // 로그인돼 있고 갈 곳이 분명하면(저장된 랩 또는 소속 연구실 1곳) 선택창 없이 곧장 앱으로
  tokenPromise.then(function (token) {
    if (!token) return showPicker();
    enterApp(token, localStorage.getItem(LAB_KEY), true).catch(showPicker);
  });
})();
</script>
</body>
</html>
